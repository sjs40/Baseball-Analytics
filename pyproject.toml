[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baseball-analytics"
version = "0.1.0"
description = "Reproducible baseball research infrastructure and foul-survival metrics."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["duckdb>=1.1", "pandas>=2.2", "polars-lts-cpu>=1.20", "pyarrow>=18", "pybaseball>=2.2.7", "textual>=1.0", "typer>=0.15"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.41", "plotly>=5.24"]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
baseball = "baseball_analytics.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/baseball_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]
